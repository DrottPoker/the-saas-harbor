name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A fixed Ubuntu release, so the environment changes only when this file does.
jobs:
  checks:
    name: Format, lint, types, unit tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  integration:
    name: Database and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only the services the tests use. Realtime delivers messages live.
      - run: npx supabase start -x studio,edge-runtime,logflare,vector,supavisor,postgres-meta,imgproxy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:db
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
